name: Daam daily prices

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 06:47 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest prices
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
        run: python daam/tools/update_prices.py
      - name: Save if changed
        run: |
          git config user.name "daam-bot"
          git config user.email "daam-bot@users.noreply.github.com"
          git add daam/prices.json
          git diff --cached --quiet || git commit -m "Daam: daily price update"
          git push
